<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Gaia Custode – Operatrice Materno Infantile</title>

  <style>
    :root {
      --salvia: #6d7f5f;
      --sabbia: #f3eee7;
      --sabbia-saturo: #e0d4c8;
      --terracotta: #d9a48f;
      --avorio: #faf8f4;
      --testo: #333;
      --grigio: #777;
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: var(--avorio);
      color: var(--testo);
      line-height: 1.7;
    }

    /* BANNER */
    .banner img {
      width: 100%;
      height: 220px; /* RIDOTTO */
      object-fit: cover;
    }

    /* HEADER CON NOME + HAMBURGER */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: var(--avorio);
    }

    .logo-nome {
      height: 180px; /* RADDOPPIATO */
    }

    .hamburger {
      width: 32px;
      height: 32px;
      cursor: pointer;
    }

    /* MENU MOBILE */
    nav {
      display: none;
      flex-direction: column;
      background: var(--avorio);
      padding: 1rem;
      border-bottom: 1px solid #eee;
    }

    nav a {
      text-decoration: none;
      color: var(--salvia);
      font-weight: 600;
      padding: .6rem 0;
      font-size: 1.1rem;
    }

    /* SFONDO CON FRASE + TESTO */
    .hero-section {
      position: relative;
      margin-top: 2rem;
    }

    .hero-section img {
      width: 100%;
      height: auto;
      opacity: 0.2;
    }

    .hero-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-content h1 {
      text-align: center;
      font-size: 2.4rem;
      font-style: italic;
      color: var(--salvia);
      margin-bottom: .5rem;
    }

    .hero-content .proverb {
      text-align: right;
      font-size: .9rem;
      color: var(--grigio);
      margin-right: 1rem;
    }
